<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 84" width="300" height="84" role="img" aria-label="Scout Consultatory Logo">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap');
    </style>
  </defs>


  <!-- ═══════════════════════════════════════
       COMPASS MARK  ·  centered at (42, 42)
       ═══════════════════════════════════════ -->
  <g transform="translate(42,42)">

    <!-- Outer ring -->
    <circle r="27" fill="none" stroke="#C9A84C" stroke-width="1.1" opacity="0.65"/>

    <!-- Diagonal hairline ticks (NE SW NW SE) -->
    <line x1="18.4" y1="-18.4" x2="14.1" y2="-14.1" stroke="#C9A84C" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
    <line x1="18.4"  y1="18.4" x2="14.1"  y2="14.1" stroke="#C9A84C" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
    <line x1="-18.4" y1="18.4" x2="-14.1" y2="14.1" stroke="#C9A84C" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
    <line x1="-18.4" y1="-18.4" x2="-14.1" y2="-14.1" stroke="#C9A84C" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>

    <!-- Cardinal arms  (N long, E/S/W shorter) -->
    <!-- North arm -->
    <line x1="0" y1="-27" x2="0" y2="-13" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round"/>
    <!-- South arm -->
    <line x1="0"   y1="13" x2="0"   y2="27" stroke="#C9A84C" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
    <!-- East arm -->
    <line x1="13"  y1="0"  x2="27"  y2="0"  stroke="#C9A84C" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
    <!-- West arm -->
    <line x1="-27" y1="0"  x2="-13" y2="0"  stroke="#C9A84C" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>

    <!-- North pointer — filled gold diamond -->
    <polygon points="0,-13  5,-4  0,0  -5,-4" fill="#C9A84C"/>

    <!-- South pointer — dimmed, smaller -->
    <polygon points="0,13  3.2,6.5  0,3  -3.2,6.5" fill="#C9A84C" opacity="0.32"/>

    <!-- Inner ring (subtle) -->
    <circle r="5.5" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.35"/>

    <!-- Center dot -->
    <circle r="2.2" fill="#C9A84C"/>

  </g>

  <!-- Vertical divider -->
  <line x1="81" y1="22" x2="81" y2="62" stroke="#C9A84C" stroke-width="0.7" opacity="0.38"/>

  <!-- ═══════════════════════════════════════
       WORDMARK
       ═══════════════════════════════════════ -->

  <!-- "SCOUT" -->
  <text
    x="95" y="40"
    font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="21"
    font-weight="700"
    fill="#FFFFFF"
    letter-spacing="-0.4">SCOUT</text>

  <!-- "CONSULTATORY" -->
  <text
    x="95.5" y="58"
    font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="9.2"
    font-weight="500"
    fill="#C9A84C"
    letter-spacing="3.8">CONSULTATORY</text>

</svg>
