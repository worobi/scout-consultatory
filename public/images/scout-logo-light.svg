<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 84" width="300" height="84" role="img" aria-label="Scout Consultatory Logo — Light Version">

  <!-- Light background -->
  <rect width="300" height="84" fill="#FFFFFF"/>

  <!-- Compass Mark — centered at 42,42 -->
  <g transform="translate(42,42)">

    <!-- Outer ring -->
    <circle r="27" fill="none" stroke="#1B2A4A" stroke-width="1.1" opacity="0.55"/>

    <!-- Diagonal ticks -->
    <line x1="18.4"  y1="-18.4" x2="14.1"  y2="-14.1" stroke="#1B2A4A" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>
    <line x1="18.4"  y1="18.4"  x2="14.1"  y2="14.1"  stroke="#1B2A4A" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>
    <line x1="-18.4" y1="18.4"  x2="-14.1" y2="14.1"  stroke="#1B2A4A" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>
    <line x1="-18.4" y1="-18.4" x2="-14.1" y2="-14.1" stroke="#1B2A4A" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>

    <!-- Cardinal arms -->
    <line x1="0"   y1="-27" x2="0"   y2="-13" stroke="#1B2A4A" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="0"   y1="13"  x2="0"   y2="27"  stroke="#1B2A4A" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>
    <line x1="13"  y1="0"   x2="27"  y2="0"   stroke="#1B2A4A" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>
    <line x1="-27" y1="0"   x2="-13" y2="0"   stroke="#1B2A4A" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>

    <!-- North pointer — navy on light bg -->
    <polygon points="0,-13  5,-4  0,0  -5,-4" fill="#C9A84C"/>

    <!-- South pointer -->
    <polygon points="0,13  3.2,6.5  0,3  -3.2,6.5" fill="#1B2A4A" opacity="0.28"/>

    <!-- Inner ring -->
    <circle r="5.5" fill="none" stroke="#1B2A4A" stroke-width="0.8" opacity="0.3"/>

    <!-- Center dot -->
    <circle r="2.2" fill="#C9A84C"/>

  </g>

  <!-- Vertical divider -->
  <line x1="81" y1="22" x2="81" y2="62" stroke="#1B2A4A" stroke-width="0.7" opacity="0.25"/>

  <!-- "SCOUT" — navy on white -->
  <text
    x="95" y="40"
    font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="21"
    font-weight="700"
    fill="#1B2A4A"
    letter-spacing="-0.4">SCOUT</text>

  <!-- "CONSULTATORY" — gold on white -->
  <text
    x="95.5" y="58"
    font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="9.2"
    font-weight="500"
    fill="#C9A84C"
    letter-spacing="3.8">CONSULTATORY</text>

</svg>
