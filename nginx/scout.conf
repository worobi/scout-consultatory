# ─────────────────────────────────────────────────────────────
#  Nginx config for Scout Consultatory
#  Place in: /etc/nginx/sites-available/scout-consultatory
#  Enable:   ln -s /etc/nginx/sites-available/scout-consultatory /etc/nginx/sites-enabled/
#  Test:     nginx -t
#  Reload:   systemctl reload nginx
# ─────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name scoutconsultatory.com www.scoutconsultatory.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scoutconsultatory.com www.scoutconsultatory.com;

    # ── SSL (Let's Encrypt via certbot) ─────────────────────
    ssl_certificate     /etc/letsencrypt/live/scoutconsultatory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scoutconsultatory.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"      always;
    add_header X-XSS-Protection         "1; mode=block"   always;
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header Referrer-Policy          "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip ──────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml text/javascript
                    application/json application/javascript
                    application/xml+rss application/atom+xml
                    image/svg+xml;

    # ── Static assets (served directly by nginx) ──────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root       /var/www/scout-consultatory/public;
        expires    30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── API + app (proxy to Node) ─────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;

        # Rate limiting (define zones in nginx.conf main block)
        # limit_req zone=api burst=20 nodelay;
    }

    # ── Health check (no logging) ─────────────────────────
    location /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # ── Block common attack paths ──────────────────────────
    location ~ /\.(?!well-known) { deny all; }
    location ~ /wp-admin          { return 404; }
    location ~ /\.env              { return 404; }
}
